name: Check FreeRDP launch options

on:
  workflow_call:

permissions:
  contents: read

jobs:
  parser:
    name: Parse RDP options with FreeRDP
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - name: Install FreeRDP SDK and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config freerdp3-dev libwinpr3-dev python3-pytest
      - name: Check generated options and keyboard mappings without connecting
        env:
          PYTHONPATH: src
          SNAKESH_REQUIRE_FREERDP_PARSER_TEST: "1"
        run: python3 -m pytest -v tests/test_freerdp_cli_runtime.py
