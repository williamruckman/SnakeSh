name: Prepare Release Draft

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-terminal:
    name: Check Windows terminal graphics
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Prepare Microsoft console runtime
        run: python packaging/windows/prepare_conpty.py
      - name: Check native terminal output and Sixel conversion
        run: python -m pytest -vv --junitxml=windows-terminal-tests.xml tests/test_windows_sixel_runtime.py
      - name: Report terminal failures
        if: failure()
        run: python packaging/windows/report_test_results.py windows-terminal-tests.xml
      - name: Save terminal test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-terminal-tests
          path: windows-terminal-tests.xml

  draft:
    name: Create Draft Release
    needs: windows-terminal
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check draft tag against VERSION
        id: version
        shell: bash
        run: |
          if [[ ! -f VERSION ]]; then
            echo "::notice title=Draft release skipped::${GITHUB_REF_NAME} does not contain a VERSION file."
            echo "should_create=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          expected_tag="v${version}"
          if [[ -z "${version}" || "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::notice title=Draft release skipped::VERSION does not match tag (${version:-empty} != ${GITHUB_REF_NAME})."
            echo "should_create=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "should_create=true" >> "${GITHUB_OUTPUT}"

      - name: Check for existing release
        id: release
        if: steps.version.outputs.should_create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create draft release
        if: steps.version.outputs.should_create == 'true' && steps.release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
